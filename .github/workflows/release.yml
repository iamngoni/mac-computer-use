name: Signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      CODE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      # The runner context is only available inside steps, not in job env.
      - name: Locate temporary signing keychain
        run: echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/maccu-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          clean: true
          persist-credentials: false

      - name: Validate tag and source
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '[:space:]' < VERSION)"
          git tag --points-at HEAD | grep -Fxq "$RELEASE_TAG"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$SIGNING_KEYCHAIN"
          certificate="$RUNNER_TEMP/maccu-signing.p12"
          security delete-keychain "$keychain" 2>/dev/null || true
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          # The .p12 is an aggregate of the certificate and its private key;
          # importing it as a certificate alone leaves no signing identity.
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -t agg -T /usr/bin/codesign -k "$keychain"
          rm "$certificate"
          # Apple's Developer ID G2 intermediate, pinned by fingerprint, for a
          # .p12 exported without it; the identity cannot validate otherwise.
          if ! security find-certificate -a -Z "$keychain" | grep -q "SHA-1 hash: 5B45F61068B29FCC8FFFF1A7E99B78DA9E9C4635"; then
            intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
            curl -fsSL --retry 3 -o "$intermediate" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $intermediate" | shasum -a 256 -c -
            security import "$intermediate" -t cert -k "$keychain"
            rm "$intermediate"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "The signing keychain has no valid Developer ID Application identity." >&2
            security find-identity -p codesigning "$keychain" | tail -n 1 >&2
            exit 1
          fi

      - name: Test source
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build, sign, notarize, and package
        run: ./scripts/package_release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/MacComputerUse-*.dmg \
            dist/MacComputerUse-*.zip \
            dist/appcast.xml \
            dist/mac-computer-use.rb \
            --verify-tag \
            --generate-notes \
            --title "Mac Computer Use $(tr -d '[:space:]' < VERSION)"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
