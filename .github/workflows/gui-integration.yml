name: GUI integration

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gui-integration:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false

      - name: Reset build state
        run: git clean -ffdx

      - name: Build signed app bundle
        run: ./build.sh

      - name: Grant Accessibility and Screen Recording
        # GitHub-hosted macOS runners have SIP disabled, so TCC grants can be
        # written directly for the freshly built (ad-hoc signed) bundle.
        run: |
          app_bin="$PWD/MacComputerUse.app/Contents/MacOS/mac-computer-use"
          now=$(date +%s)
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo test -f "$db" || continue
            for service in kTCCServiceAccessibility kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceListenEvent; do
              for entry in "com.modestnerd.mac-computer-use|0" "$app_bin|1" "/usr/bin/python3|1"; do
                client="${entry%|*}"; type="${entry##*|}"
                sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified) VALUES ('$service', '$client', $type, 2, 4, 1, 'UNUSED', 0, $now);"
              done
            done
          done
          sudo killall tccd 2>/dev/null || true

      - name: Run permissioned lifecycle tests
        run: python3 tests/test_live_app_resolution.py -v

      - name: Verify tracked tree stayed clean
        if: always()
        run: git diff --exit-code
