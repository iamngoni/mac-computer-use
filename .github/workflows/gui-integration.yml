name: GUI integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gui-integration:
    runs-on: [self-hosted, macOS, ARM64, maccu-tcc]
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false

      - name: Reset build state
        run: git clean -ffdx

      - name: Build signed app bundle
        run: ./build.sh

      - name: Run permissioned lifecycle tests
        run: python3 tests/test_live_app_resolution.py -v

      - name: Verify tracked tree stayed clean
        if: always()
        run: git diff --exit-code
